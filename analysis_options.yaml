# Static analysis for ResQMesh. `flutter analyze` must report no issues
# before a phase is closed (PROJECT_PLAN.md §15.1).
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - "**/*.g.dart"

linter:
  rules:
    - always_declare_return_types
    - always_use_package_imports
    - avoid_dynamic_calls
    - avoid_print
    - avoid_redundant_argument_values
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - directives_ordering
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - only_throw_errors
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_statements
    - use_named_constants
    - use_super_parameters
